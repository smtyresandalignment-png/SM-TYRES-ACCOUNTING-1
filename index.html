<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM TYRES & ALIGNMENT</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b2b;
    color:white;
}

header{
    text-align:center;
    padding:20px 10px;
    background:linear-gradient(135deg,#061522,#123e5f);
}

.logo{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#444 0 35%,#111 36% 58%,#f5a623 59% 65%,#111 66%);
    border:3px solid #f5a623;
}

.logo div{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    display:block;
    font-size:7px;
    color:#f5a623;
}

header h1{
    margin:10px 0 4px;
    font-size:23px;
}

header p{
    margin:0;
    font-size:12px;
    color:#b8c9d5;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.menu button{
    min-height:65px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#f5b632,#d47d00);
    color:#071b2b;
    font-size:14px;
    font-weight:bold;
}

.menu button:nth-child(even){
    background:linear-gradient(135deg,#1888c9,#10527c);
    color:white;
}

button{
    border:0;
    border-radius:9px;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    width:100%;
    margin-top:10px;
    background:#f5a623;
    color:#071b2b;
}

.back{
    background:#456278;
    color:white;
    margin-bottom:12px;
}

.panel{
    background:#102e47;
    padding:15px;
    border-radius:12px;
}

input,select{
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #47657b;
    background:#061a2a;
    color:white;
    font-size:15px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.list{
    margin-top:12px;
}

.item{
    background:#102e47;
    padding:13px;
    margin-bottom:8px;
    border-radius:10px;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.edit{
    background:#7557a5;
    color:white;
}

.delete{
    background:#c0392b;
    color:white;
}

.invoice{
    background:white;
    color:#111;
    padding:18px;
    border-radius:10px;
    margin-bottom:10px;
}

.empty{
    background:#102e47;
    padding:20px;
    text-align:center;
    border-radius:10px;
    color:#aabcca;
}

h2{
    font-size:20px;
}

.notice{
    background:#49380e;
    color:#f5d889;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

@media(min-width:700px){
    .menu{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
<div>
SM
<span>TYRES & ALIGNMENT</span>
</div>
</div>

<h1>SM TYRES & ALIGNMENT</h1>

<p>ACCOUNTING SYSTEM</p>

</header>

<div class="container">


<!-- DASHBOARD -->

<div id="dashboard" class="screen active">

<h2>Dashboard</h2>

<div class="menu">

<button onclick="openPage('sales')">
💰 SALES
</button>

<button onclick="openPage('purchases')">
🛒 PURCHASES
</button>

<button onclick="openPage('products')">
📦 PRODUCTS
</button>

<button onclick="openPage('inventory')">
📋 INVENTORY
</button>

<button onclick="openPage('expenses')">
💸 EXPENSES
</button>

<button onclick="openPage('customers')">
👥 CUSTOMERS
</button>

<button onclick="openPage('suppliers')">
🏢 SUPPLIERS
</button>

<button onclick="openPage('reports')">
📊 REPORTS
</button>

</div>

</div>


<!-- SALES -->

<div id="sales" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>💰 Sales Invoice</h2>

<div class="panel">

<label>Date</label>
<input id="saleDate" type="date">

<input id="saleCustomer"
placeholder="Customer name">

<select id="saleProduct">
<option value="">Select Product</option>
</select>

<div class="row">

<input id="saleQty"
type="number"
min="1"
value="1"
placeholder="Quantity">

<input id="salePrice"
type="number"
min="0"
placeholder="Selling price">

</div>

<button class="primary" onclick="makeSale()">
CREATE SALES INVOICE
</button>

</div>

<div id="salesList" class="list"></div>

</div>


<!-- PURCHASES -->

<div id="purchases" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>🛒 Purchases</h2>

<div class="panel">

<label>Date</label>
<input id="purchaseDate" type="date">

<input id="purchaseSupplier"
placeholder="Supplier name">

<select id="purchaseProduct">
<option value="">Select Product</option>
</select>

<div class="row">

<input id="purchaseQty"
type="number"
min="1"
value="1"
placeholder="Quantity">

<input id="purchasePrice"
type="number"
min="0"
placeholder="Buying price">

</div>

<button class="primary" onclick="makePurchase()">
RECORD PURCHASE
</button>

</div>

<div id="purchaseList" class="list"></div>

</div>


<!-- PRODUCTS -->

<div id="products" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>📦 Product Management</h2>

<div class="panel">

<input id="productCode"
placeholder="Product code / SKU">

<input id="productName"
placeholder="Product name">

<input id="productCategory"
placeholder="Category">

<button class="primary" onclick="addProduct()">
➕ ADD PRODUCT
</button>

<input id="productSearch"
placeholder="🔎 Search product"
oninput="showProducts()">

</div>

<div id="productList" class="list"></div>

</div>


<!-- INVENTORY -->

<div id="inventory" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>📋 Inventory</h2>

<div class="notice">
Purchases increase stock. Sales decrease stock.
</div>

<div id="inventoryList" class="list"></div>

</div>


<!-- EXPENSES -->

<div id="expenses" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>💸 Expenses</h2>

<div class="panel">

<label>Date</label>
<input id="expenseDate" type="date">

<input id="expenseName"
placeholder="Expense description">

<input id="expenseAmount"
type="number"
placeholder="Amount in TSh">

<button class="primary" onclick="addExpense()">
RECORD EXPENSE
</button>

</div>

<div id="expenseList" class="list"></div>

</div>


<!-- CUSTOMERS -->

<div id="customers" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>👥 Customers</h2>

<div class="panel">

<input id="customerName"
placeholder="Customer name">

<input id="customerPhone"
placeholder="Phone number">

<button class="primary" onclick="addCustomer()">
ADD CUSTOMER
</button>

</div>

<div id="customerList" class="list"></div>

</div>


<!-- SUPPLIERS -->

<div id="suppliers" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>🏢 Suppliers</h2>

<div class="panel">

<input id="supplierName"
placeholder="Supplier name">

<input id="supplierPhone"
placeholder="Phone number">

<button class="primary" onclick="addSupplier()">
ADD SUPPLIER
</button>

</div>

<div id="supplierList" class="list"></div>

</div>


<!-- REPORTS -->

<div id="reports" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>📊 Reports</h2>

<div id="reportList"></div>

<h2>🧾 Sales Invoices</h2>

<div id="invoiceList"></div>

</div>


</div>


<script>

/* =========================
DATABASE
========================= */

var database={
products:[],
sales:[],
purchases:[],
expenses:[],
customers:[],
suppliers:[]
};

var saved=localStorage.getItem(
"SM_TYRES_DATABASE"
);

if(saved){

try{
database=JSON.parse(saved);
}catch(error){
console.log(error);
}

}


/* =========================
SAVE
========================= */

function saveData(){

localStorage.setItem(
"SM_TYRES_DATABASE",
JSON.stringify(database)
);

}


/* =========================
TODAY
========================= */

function today(){

var d=new Date();

var month=
String(d.getMonth()+1)
.padStart(2,"0");

var day=
String(d.getDate())
.padStart(2,"0");

return d.getFullYear()+
"-"+
month+
"-"+
day;

}


/* =========================
MONEY
========================= */

function money(number){

return "TSh "+
Number(number||0)
.toLocaleString();

}


/* =========================
OPEN PAGE
========================= */

function openPage(page){

var screens=
document.querySelectorAll(".screen");

for(var i=0;i<screens.length;i++){

screens[i].classList.remove("active");

}

var selected=
document.getElementById(page);

if(selected){

selected.classList.add("active");

}

setDates();

renderAll();

window.scrollTo(0,0);

}


/* =========================
DATES
========================= */

function setDates(){

if(document.getElementById("saleDate").value==="")
document.getElementById("saleDate").value=today();

if(document.getElementById("purchaseDate").value==="")
document.getElementById("purchaseDate").value=today();

if(document.getElementById("expenseDate").value==="")
document.getElementById("expenseDate").value=today();

}


/* =========================
PRODUCT FIND
========================= */

function findProduct(id){

for(var i=0;i<database.products.length;i++){

if(String(database.products[i].id)===String(id))
return database.products[i];

}

return null;

}


/* =========================
PRODUCT OPTIONS
========================= */

function productOptions(){

var html=
'<option value="">Select Product</option>';

for(var i=0;i<database.products.length;i++){

var p=database.products[i];

html+=
'<option value="'+p.id+'">'+
p.name+
'</option>';

}

document.getElementById(
"saleProduct"
).innerHTML=html;

document.getElementById(
"purchaseProduct"
).innerHTML=html;

}


/* =========================
ADD PRODUCT
========================= */

function addProduct(){

var name=
document.getElementById(
"productName"
).value.trim();

if(name===""){

alert("Enter product name.");

return;

}

var product={

id:Date.now(),

code:
document.getElementById(
"productCode"
).value.trim(),

name:name,

category:
document.getElementById(
"productCategory"
).value.trim(),

stock:0,

cost:0

};

database.products.push(product);

saveData();

document.getElementById(
"productCode"
).value="";

document.getElementById(
"productName"
).value="";

document.getElementById(
"productCategory"
).value="";

renderAll();

alert("Product added successfully.");

}


/* =========================
EDIT PRODUCT
========================= */

function editProduct(id){

var p=findProduct(id);

if(!p)return;

var name=prompt(
"Product name:",
p.name
);

if(name===null)return;

var category=prompt(
"Category:",
p.category||""
);

if(category===null)return;

var code=prompt(
"Product code:",
p.code||""
);

if(code===null)return;

p.name=name.trim()||p.name;

p.category=category.trim();

p.code=code.trim();

saveData();

renderAll();

alert("Product updated.");

}


/* =========================
DELETE PRODUCT
========================= */

function deleteProduct(id){

var p=findProduct(id);

if(!p)return;

if(p.stock>0){

alert(
"Cannot delete this product because stock is still available."
);

return;

}

var answer=
confirm(
"Delete "+p.name+"?"
);

if(!answer)return;

database.products=
database.products.filter(
function(item){
return item.id!==id;
}
);

saveData();

renderAll();

}


/* =========================
PURCHASE
========================= */

function makePurchase(){

var product=
findProduct(
document.getElementById(
"purchaseProduct"
).value
);

var qty=
Number(
document.getElementById(
"purchaseQty"
).value
);

var price=
Number(
document.getElementById(
"purchasePrice"
).value
);

var supplier=
document.getElementById(
"purchaseSupplier"
).value.trim();

if(!product){

alert("Select a product.");

return;

}

if(qty<=0){

alert("Enter quantity.");

return;

}

if(price<=0){

alert("Enter buying price.");

return;

}

product.stock+=qty;

product.cost=price;

database.purchases.push({

date:
document.getElementById(
"purchaseDate"
).value,

supplier:
supplier||"Unknown",

productId:product.id,

quantity:qty,

price:price,

total:qty*price

});

if(supplier!==""){

database.suppliers.push({

name:supplier,

phone:""

});

}

saveData();

document.getElementById(
"purchaseSupplier"
).value="";

document.getElementById(
"purchaseQty"
).value=1;

document.getElementById(
"purchasePrice"
).value="";

renderAll();

alert("Purchase recorded successfully.");

}


/* =========================
SALE
========================= */

function makeSale(){

var product=
findProduct(
document.getElementById(
"saleProduct"
).value
);

var qty=
Number(
document.getElementById(
"saleQty"
).value
);

var price=
Number(
document.getElementById(
"salePrice"
).value
);

var customer=
document.getElementById(
"saleCustomer"
).value.trim();

if(!product){

alert("Select a product.");

return;

}

if(qty<=0){

alert("Enter quantity.");

return;

}

if(price<=0){

alert("Enter selling price.");

return;

}

if(product.stock<qty){

alert(
"Not enough stock.\nAvailable: "+
product.stock
);

return;

}

var invoice=
"INV-"+String(
database.sales.length+1
).padStart(4,"0");

var cost=
product.cost||0;

product.stock-=qty;

database.sales.push({

invoice:invoice,

date:
document.getElementById(
"saleDate"
).value,

customer:
customer||"Cash Customer",

productId:product.id,

quantity:qty,

price:price,

cost:cost,

total:qty*price,

costTotal:qty*cost,

profit:(price-cost)*qty

});

if(customer!==""){

database.customers.push({

name:customer,

phone:""

});

}

saveData();

document.getElementById(
"saleCustomer"
).value="";

document.getElementById(
"saleQty"
).value=1;

document.getElementById(
"salePrice"
).value="";

renderAll();

alert(
"Sales Invoice "+
invoice+
" created successfully."
);

}


/* =========================
EXPENSE
========================= */

function addExpense(){

var name=
document.getElementById(
"expenseName"
).value.trim();

var amount=
Number(
document.getElementById(
"expenseAmount"
).value
);

if(name===""){

alert("Enter expense description.");

return;

}

if(amount<=0){

alert("Enter expense amount.");

return;

}

database.expenses.push({

date:
document.getElementById(
"expenseDate"
).value,

name:name,

amount:amount

});

saveData();

document.getElementById(
"expenseName"
).value="";

document.getElementById(
"expenseAmount"
).value="";

renderAll();

alert("Expense recorded.");

}


/* =========================
CUSTOMER
========================= */

function addCustomer(){

var name=
document.getElementById(
"customerName"
).value.trim();

if(name===""){

alert("Enter customer name.");

return;

}

database.customers.push({

name:name,

phone:
document.getElementById(
"customerPhone"
).value.trim()

});

saveData();

document.getElementById(
"customerName"
).value="";

document.getElementById(
"customerPhone"
).value="";

renderAll();

alert("Customer added.");

}


/* =========================
SUPPLIER
========================= */

function addSupplier(){

var name=
document.getElementById(
"supplierName"
).value.trim();

if(name===""){

alert("Enter supplier name.");

return;

}

database.suppliers.push({

name:name,

phone:
document.getElementById(
"supplierPhone"
).value.trim()

});

saveData();

document.getElementById(
"supplierName"
).value="";

document.getElementById(
"supplierPhone"
).value="";

renderAll();

alert("Supplier added.");

}


/* =========================
PRODUCT LIST
========================= */

function showProducts(){

var search=
document.getElementById(
"productSearch"
).value
.toLowerCase();

var html="";

for(var i=0;i<database.products.length;i++){

var p=database.products[i];

if(
search!=="" &&
p.name.toLowerCase()
.indexOf(search)===-1 &&
(p.code||"")
.toLowerCase()
.indexOf(search)===-1
){

continue;

}

html+=
'<div class="item">'+

'<b>'+p.name+'</b><br>'+

'Code: '+(p.code||"-")+'<br>'+

'Category: '+(p.category||"-")+'<br>'+

'Stock: '+p.stock+'<br>'+

'Buying cost: '+money(p.cost)+

'<div class="actions">'+

'<button class="edit" onclick="editProduct('+p.id+')">'+
'✏️ EDIT'+
'</button>'+

'<button class="delete" onclick="deleteProduct('+p.id+')">'+
'🗑 DELETE'+
'</button>'+

'</div>'+

'</div>';

}

if(html===""){

html=
'<div class="empty">No products yet.</div>';

}

document.getElementById(
"productList"
).innerHTML=html;

}


/* =========================
INVENTORY
========================= */

function showInventory(){

var html="";

for(var i=0;i<database.products.length;i++){

var p=database.products[i];

html+=
'<div class="item">'+

'<b>'+p.name+'</b><br>'+

'Stock: <b>'+p.stock+'</b><br>'+

'Buying cost: '+money(p.cost)+

'</div>';

}

if(html===""){

html=
'<div class="empty">No products yet.</div>';

}

document.getElementById(
"inventoryList"
).innerHTML=html;

}


/* =========================
SALES LIST
========================= */

function showSales(){

var html="";

for(
var i=database.sales.length-1;
i>=0;
i--
){

var s=database.sales[i];

var p=findProduct(s.productId);

html+=
'<div class="item">'+

'<b>'+s.invoice+'</b><br>'+

'Date: '+s.date+'<br>'+

'Customer: '+s.customer+'<br>'+

'Product: '+(p?p.name:"Unknown")+'<br>'+

'Quantity: '+s.quantity+'<br>'+

'Total: '+money(s.total)+'<br>'+

'Profit: '+money(s.profit)+

'</div>';

}

if(html===""){

html=
'<div class="empty">No sales yet.</div>';

}

document.getElementById(
"salesList"
).innerHTML=html;

}


/* =========================
PURCHASE LIST
========================= */

function showPurchases(){

var html="";

for(
var i=database.purchases.length-1;
i>=0;
i--
){

var p=database.purchases[i];

var product=
findProduct(p.productId);

html+=
'<div class="item">'+

'<b>'+
(product?product.name:"Unknown")+
'</b><br>'+

'Date: '+p.date+'<br>'+

'Supplier: '+p.supplier+'<br>'+

'Quantity: '+p.quantity+'<br>'+

'Total: '+money(p.total)+

'</div>';

}

if(html===""){

html=
'<div class="empty">No purchases yet.</div>';

}

document.getElementById(
"purchaseList"
).innerHTML=html;

}


/* =========================
EXPENSE LIST
========================= */

function showExpenses(){

var html="";

for(
var i=database.expenses.length-1;
i>=0;
i--
){

var e=database.expenses[i];

html+=
'<div class="item">'+

'<b>'+e.name+'</b><br>'+

'Date: '+e.date+'<br>'+

'Amount: '+money(e.amount)+

'</div>';

}

if(html===""){

html=
'<div class="empty">No expenses yet.</div>';

}

document.getElementById(
"expenseList"
).innerHTML=html;

}


/* =========================
CUSTOMER LIST
========================= */

function showCustomers(){

var html="";

for(var i=0;i<database.customers.length;i++){

var c=database.customers[i];

html+=
'<div class="item">'+

'<b>'+c.name+'</b><br>'+

(c.phone||"No phone number")+

'</div>';

}

if(html===""){

html=
'<div class="empty">No customers yet.</div>';

}

document.getElementById(
"customerList"
).innerHTML=html;

}


/* =========================
SUPPLIER LIST
========================= */

function showSuppliers(){

var html="";

for(var i=0;i<database.suppliers.length;i++){

var s=database.suppliers[i];

html+=
'<div class="item">'+

'<b>'+s.name+'</b><br>'+

(s.phone||"No phone number")+

'</div>';

}

if(html===""){

html=
'<div class="empty">No suppliers yet.</div>';

}

document.getElementById(
"supplierList"
).innerHTML=html;

}


/* =========================
REPORTS
========================= */

function showReports(){

var sales=0;
var cost=0;
var expenses=0;

for(var i=0;i<database.sales.length;i++){

sales+=database.sales[i].total;

cost+=database.sales[i].costTotal;

}

for(var j=0;j<database.expenses.length;j++){

expenses+=database.expenses[j].amount;

}

var gross=sales-cost;

var net=gross-expenses;

document.getElementById(
"reportList"
).innerHTML=

'<div class="item">'+
'<b>Total Sales</b><br>'+
money(sales)+
'</div>'+

'<div class="item">'+
'<b>Cost of Goods Sold</b><br>'+
money(cost)+
'</div>'+

'<div class="item">'+
'<b>Gross Profit</b><br>'+
money(gross)+
'</div>'+

'<div class="item">'+
'<b>Total Expenses</b><br>'+
money(expenses)+
'</div>'+

'<div class="item">'+
'<b>NET PROFIT</b><br>'+
money(net)+
'</div>';


var invoices="";

for(
var k=database.sales.length-1;
k>=0;
k--
){

var s=database.sales[k];

var p=findProduct(s.productId);

invoices+=

'<div class="invoice">'+

'<h3>SM TYRES & ALIGNMENT</h3>'+

'<b>SALES INVOICE</b><hr>'+

'Invoice: '+s.invoice+'<br>'+

'Date: '+s.date+'<br>'+

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SM TYRES AND ALIGNMENT ACCOUNTING 1</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    color:#17202a;
}

body{
    background:
    linear-gradient(rgba(2,13,22,.90),rgba(2,13,22,.95)),
    radial-gradient(circle at top right,#168ac4,#06111b 55%);
    background-attachment:fixed;
}

/* HEADER */

.header{
    padding:20px 15px;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#06131f,#0d4264,#06131f);
    border-bottom:3px solid #19a7e8;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border:4px solid #19a7e8;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07131f;
    font-size:32px;
    box-shadow:0 0 20px rgba(25,167,232,.5);
}

.header h1{
    margin:9px 0 3px;
    font-size:23px;
    letter-spacing:1px;
}

.header p{
    margin:0;
    color:#bfeaff;
    font-size:13px;
}

/* APP */

.app{
    width:100%;
    max-width:1200px;
    margin:auto;
}

.screen{
    display:none;
    padding:16px;
}

.screen.active{
    display:block;
}

.title{
    color:white;
    font-size:23px;
    margin:5px 0 16px;
}

/* MAIN MENU */

.home{
    padding:18px;
}

.home-title{
    color:white;
    text-align:center;
    margin:5px 0 5px;
    font-size:25px;
}

.home-subtitle{
    color:#a9c9d9;
    text-align:center;
    margin:0 0 20px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.menu-btn{
    min-height:100px;
    border:0;
    border-radius:16px;
    background:linear-gradient(145deg,#126f9e,#0a4566);
    color:white;
    font-weight:bold;
    font-size:15px;
    box-shadow:0 6px 14px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.12);
    cursor:pointer;
    touch-action:manipulation;
}

.menu-btn:active{
    transform:scale(.96);
    background:#159bd8;
}

.icon{
    display:block;
    font-size:31px;
    margin-bottom:8px;
}

/* FORMS */

.form{
    background:#f8fbfd;
    padding:17px;
    border-radius:15px;
    box-shadow:0 7px 18px rgba(0,0,0,.3);
}

label{
    display:block;
    margin:13px 0 5px;
    font-weight:bold;
    color:#17384d;
}

input,select,textarea{
    width:100%;
    min-height:48px;
    padding:12px;
    border:2px solid #d3e0e7;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:85px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#159bd8;
}

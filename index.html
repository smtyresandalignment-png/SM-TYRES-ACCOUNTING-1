<!-- INVENTORY -->

<div id="inventory" class="screen">

<button class="back" onclick="openPage('dashboard')">
← DASHBOARD
</button>

<h2>📋 Inventory</h2>

<div class="notice">
Purchases increase stock. Sales decrease stock.<br>
Transfer In increases stock. Transfer Out decreases stock.
</div>

<!-- INVENTORY MOVEMENT -->

<div class="panel">

<h3>🔄 Inventory Movement</h3>

<label>Date</label>
<input id="movementDate" type="date">

<select id="movementProduct">
<option value="">Select Product</option>
</select>

<div class="row">

<input id="movementQty"
type="number"
min="1"
value="1"
placeholder="Quantity">

<select id="movementType">

<option value="IN">
TRANSFER IN
</option>

<option value="OUT">
TRANSFER OUT
</option>

</select>

</div>

<input id="movementReference"
placeholder="Reference / Note (optional)">

<button
class="primary"
onclick="transferIn()">

⬆️ TRANSFER IN

</button>

<button
class="primary"
onclick="transferOut()">

⬇️ TRANSFER OUT

</button>

</div>

<h3>📦 Current Stock</h3>

<div id="inventoryList" class="list"></div>

<h3>🔄 Movement History</h3>

<div id="movementList" class="list"></div>

</div>
